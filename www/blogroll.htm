<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A list of blogrolls found by the RSS feed index crawler.">
    <title>RSS Feed Index - Blogrolls</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="content">
        <header>
            <h1>Blogroll Index</h1>
                <p>
                    This page lists known OPML blogrolls found by the RSS feed index crawler.
                </p>
                <div id="stats"></div>
        </header>
        <main id="blogrolls">
        </main>
        <script type="module">
            import { RssFeedIndexSearch } from './RssFeedIndexSearch.js';

            fetch('data/blogroll.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('stats').innerHTML = `
                    <div class='stat'>Last Crawl: ${new Date(1000*data.lastUpdated).toLocaleDateString()}</div>
                    <div class='stat'>Blogrolls: ${data.count}</div>
                `;

                document.getElementById('blogrolls').innerHTML = `
                    <h2>List</h2>

                    ${Object.keys(data.blogrolls).map(roll => `<div><a href="${roll}"><img class="icon" src="opml-icon-64x64.png"/>${data.blogrolls[roll].replace("https://", "")}</a></div>`).join('')}
                `;

            });
        </script>
    </div>
</body>
</html>
