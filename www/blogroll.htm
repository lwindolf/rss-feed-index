<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A list of blogrolls found by the RSS feed index crawler.">
    <title>RSS Feed Index - Blogrolls</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="content">
        <header>
            <h1>Blogroll Index</h1>
                <p>
                    This page lists known OPML blogrolls found by the RSS feed index crawler. Blogrolls are discovered both 
                    by <tt>&lt;link rel="blogroll"&gt;</tt> tags in blog main pages and from RSS feeds using the <a href="https://source.scripting.com/">source</a> namespace.
                    There is also a <a href="https://github.com/lwindolf/rss-feed-index/blob/main/datasets/opml-curated.json">static list</a> you can extend to include other OPML locations.
                </p>
        </header>
        <main id="blogrolls">
        </main>
        <script type="module">
            import { RssFeedIndexSearch } from './RssFeedIndexSearch.js';

            fetch('data/blogroll.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('blogrolls').innerHTML = `
                    <h2>List</h2>

                    ${Object.keys(data.blogrolls).map(roll => `<div><a href="${roll}"><img class="icon" src="opml-icon-64x64.png"/>${data.blogrolls[roll].t ? data.blogrolls[roll].t : data.blogrolls[roll].u.replace("https://", "")}</a></div>`).join('')}
                `;

            });
        </script>
    </div>
</body>
</html>
