<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A searchable index of all RSS/Atom feeds from the top 1 million websites.">
    <title>RSS Feed Index</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="content">
        <header>
            <h1>RSS Feed Index</h1>
                <p>
                    This website provides access to a searchable index of RSS/Atom feeds and its raw data.
                    You can find the code and data at <a href="https://github.com/lwindolf/rss-feed-index">GitHub</a>.
                    For end users there is a more convenient <a href="https://lwindolf.github.io/rss-finder">web app</a> 
                    that even allows previewing feeds and blogrolls.
                </p>
                <div id="stats"></div>
        </header>
        <main>               
            <x-rss-feed-index-search style="RssFeedIndexSearch.css" base="data/"></x-rss-feed-index-search>
        </main>
        <hr/>
        <footer>
            <h2>Statistics</h2>

            <div id="moreStats"></div>

        </footer>
        <script type="module">
            import { RssFeedIndexSearch } from './RssFeedIndexSearch.js';

            fetch('data/meta.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('stats').innerHTML = `
                    <div class='stat'><a href="update.htm">Last Crawl</a>: ${new Date(1000*data.generated).toLocaleDateString()}</div>
                    <div class='stat'>Blogs: ${data.urls}</div>
                    <div class='stat'><a href="index.htm">Feeds</a>: ${data.feeds}</div>
                    <div class='stat'><a href="blogroll.htm">Blogrolls</a>: ${data.blogrolls}</div>
                `;

                document.getElementById('moreStats').innerHTML = `
                    <h3>Feed Formats</h3>

                    <table class="moreStats">
                        <thead>
                            <tr>
                                <th>Feed Format</th>
                                <th>Count</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.entries(data.byFeedType).sort((a,b) => b[1] - a[1]).map(([format, count]) => `
                                <tr>
                                    <td>${format}</td>
                                    <td>${count}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <h3>XML Namespaces Used</h3>

                    <table class="moreStats">
                        <thead>
                            <tr>
                                <th>Namespace</th>
                                <th>Count</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.entries(data.byNS).sort((a,b) => b[1] - a[1]).filter(([ns, count]) => count > 100).map(([ns, count]) => `
                                <tr>
                                    <td>${ns}</td>
                                    <td>${count}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <h3>Top Level Domains</h3>

                    <table class="moreStats">
                        <thead>
                            <tr>
                                <th>Top Level Domain</th>
                                <th>Count</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.entries(data.byTLD).sort((a,b) => b[1] - a[1]).filter(([tld, count]) => count > 100).map(([tld, count]) => `
                                <tr>
                                    <td>${tld}</td>
                                    <td>${count}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <h3>Protocols Used</h3>

                    <table class="moreStats">
                        <thead>
                            <tr>
                                <th>Protocol</th>
                                <th>Count</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.entries(data.byProtocol).sort((a,b) => b[1] - a[1]).filter(([protocol, count]) => count > 100).map(([protocol, count]) => `
                                <tr>
                                    <td>${protocol}</td>
                                    <td>${count}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <h3>Media Included in Feeds</h3>

                    <table class="moreStats">
                        <thead>
                            <tr>
                                <th>Media Type</th>
                                <th>Count</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.entries(data.byMedia).sort((a,b) => b[1] - a[1]).filter(([media, count]) => count > 100).map(([media, count]) => `
                                <tr>
                                    <td>${media}</td>
                                    <td>${count}</td>
                                </tr>
                            `).join('')}
                        </tbody>

                `;
            });
        </script>
    </div>
</body>
</html>
