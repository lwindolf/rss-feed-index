<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A list of blogrolls found by the RSS feed index crawler.">
    <title>RSS Feed Index - Update Status</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="content">
        <header>
            <h1>RSS Feed Index Update Status</h1>
                <p>
                    This page gives an overview of the index updating. The goal is for the index to be run once a month.
                    Red buckets indicate stale data (older than 3 months).
                </p>
                <div id="stats"></div>
        </header>
        <main>
                <h2>Buckets</h2>

                <p id="freshness-stats"></p>

                <div id="buckets"></div>
        </main>
        <script type="module">
            import { RssFeedIndexSearch } from './RssFeedIndexSearch.js';

            fetch('data/bucket-index.json?ts=' + Date.now())
            .then(response => response.json())
            .then(data => {
                const now = Date.now() / 1000; // current time in seconds
                let fresh = 0;
                document.getElementById('buckets').innerHTML = `
                ${Object.keys(data.buckets).map(b => {
                        const lastUpdate = Math.floor((now - data.buckets[b].avg) / (60 * 60 * 24)); // in days

                        // Calculate heat color: green (recent) to red (old)
                        let hue;
                        if (lastUpdate < 30) {
                                hue = 120; // green
                                fresh++;
                        } else if (lastUpdate > 3*30) { // older than 3 months
                                hue = 0; // red
                        } else {
                                hue = 120 - (lastUpdate / (3 * 30)) * 120;
                        }
                        
                        return `<div class="bucket" title="${b}: ${lastUpdate} days old" style="background-color: hsl(${hue}, 70%, 50%);"> </div>`;
                }).join('')}`;

                document.getElementById('freshness-stats').innerText = `${Math.floor(1000 - (fresh * 1000 / Object.keys(data.buckets).length))/10}% of the buckets are stale`;
            });
        </script>
    </div>
</body>
</html>
